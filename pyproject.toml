[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-calculator"
version = "0.1.0"
description = "Cryptocurrency profit and loss calculation system"
requires-python = ">=3.8"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
crypto-calculator = "crypto_calculator.main:main"

[tool.setuptools]
packages = ["crypto_calculator"]
package-dir = {"crypto_calculator" = "src"}
